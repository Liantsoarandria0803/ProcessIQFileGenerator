services:
  - type: web
    name: process-iq-rush-school-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8001
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: processiq
    healthCheckPath: /api/health
